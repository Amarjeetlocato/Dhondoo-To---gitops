apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: business-operation-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Amarjeetlocato/Dhondoo-To---gitops.git
    targetRevision: main
    path: helm/business-operation-service

    helm:
      valueFiles:
        - ../../environments/production/values/business-operation-service-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

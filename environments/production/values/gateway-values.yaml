replicaCount: 2

springProfile: production

timezone: UTC

image:
  repository: whomaiamar/gateway
  tag: v1.0.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8079
  targetPort: 8079

configMap:
  enabled: true
  data:
    SPRING_APPLICATION_NAME: gateway
    SERVER_PORT: "8079"

    SPRING_PROFILES_ACTIVE: production

    EUREKA_SERVER: "http://service-registry-service-registry.platform.svc.cluster.local:8761/eureka/"

    EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
    EUREKA_CLIENT_FETCH_REGISTRY: "true"

    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics

secret:
  enabled: true
  data:
    JWT_SECRET: CHANGE_ME_IN_PRODUCTION

serviceAccount:
  create: true

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: nginx

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

  hosts:
    - host: api.dhondoo.in
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: gateway-tls
      hosts:
        - api.dhondoo.in

nodeSelector: {}

tolerations: []

affinity: {}

imagePullSecrets: []

podAnnotations: {}

probes:
  startup:
    path: /actuator/health
    failureThreshold: 30
    periodSeconds: 10

  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 5

  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 10
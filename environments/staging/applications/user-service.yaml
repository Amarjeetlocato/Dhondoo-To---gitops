apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: user-service
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/Amarjeetlocato/Dhondoo-To---gitops.git

    targetRevision: main

    path: helm/user-service

    helm:
      valueFiles:
        - ../../environments/staging/values/user-service-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: platform

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
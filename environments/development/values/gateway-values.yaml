# environments/development/values/gateway-values.yaml
# 
replicaCount: 1
springProfile: kubernetes
timezone: UTC
image:
  repository: whomaiamar/gateway
  tag: d3cdeaa8ca78e9c090ff343b52d904b83a85c071
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8079
  targetPort: 8079
configMap:
  enabled: true
  existingName: gateway-gateway
  data:
    SPRING_APPLICATION_NAME: gateway
    SERVER_PORT: "8079"
    SERVER_ADDRESS: "0.0.0.0"
    FRONTEND_URL: "http://127.0.0.1:51006,https://locato-web.pages.dev,https://*.locato-web.pages.dev"
    EUREKA_SERVER: "http://service-registry-service-registry.platform.svc.cluster.local:8761/eureka/"
    EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://service-registry-service-registry.platform.svc.cluster.local:8761/eureka/"
    EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
    EUREKA_CLIENT_FETCH_REGISTRY: "true"
    EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "10"
    EUREKA_CLIENT_INSTANCE_INFO_REPLICATION_INTERVAL_SECONDS: "30"
    EUREKA_INSTANCE_HOSTNAME: "gateway"
    EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    EUREKA_CLIENT_HEALTHCHECK_ENABLED: "true"
    SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED: "true"
    SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE_ID: "true"
    SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: "10000"
    SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: "60s"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics"
secret:
  enabled: false
  existingName: gateway-secret
serviceAccount:
  create: true
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "500m"
    memory: 512Mi
autoscaling:
  enabled: false
pdb:
  enabled: false
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: gateway.local
      paths:
        - path: /
          pathType: Prefix
topologySpreadConstraints:
  enabled: false
podAntiAffinity:
  enabled: false
probes:
  startup:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 60
    successThreshold: 1
  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1
  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 20
    failureThreshold: 3
    successThreshold: 1
terminationGracePeriodSeconds: 30
lifecycle:
  enabled: true
  preStop:
    enabled: true
    command:
      - /bin/sh
      - -c
      - sleep 5

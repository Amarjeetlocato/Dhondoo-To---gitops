clusterName: dhondoo-kafka

namespace: messaging

version: 4.1.0

replicas: 3

storage:

  kafka: 20Gi

  controller: 10Gi

resources:

  kafka:

    requests:

      cpu: 500m

      memory: 1Gi

    limits:

      cpu: "2"

      memory: 2Gi

  controller:

    requests:

      cpu: 250m

      memory: 512Mi

    limits:

      cpu: "1"

      memory: 1Gi

topics:

  partitions: 3

  replicas: 3

retention:

  days: 7
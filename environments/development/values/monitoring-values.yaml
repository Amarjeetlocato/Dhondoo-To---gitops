kube-prometheus-stack:

  crds:
    enabled: true
    upgradeJob:
      enabled: false

  prometheusOperator:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  prometheus:
    enabled: true
    prometheusSpec:
      replicas: 1
      retention: 2d
      scrapeInterval: 30s
      evaluationInterval: 30s
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector:
        matchLabels:
          release: monitoring-dev
      serviceMonitorNamespaceSelector: {}
      ruleSelectorNilUsesHelmValues: false
      ruleSelector:
        matchLabels:
          release: monitoring-dev
      ruleNamespaceSelector: {}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 1
      alertmanagerConfigSelector: {}
      alertmanagerConfigNamespaceSelector: {}
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi

  grafana:
    enabled: true
    admin:
      existingSecret: monitoring-dev-grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  kubeStateMetrics:
    enabled: true

  nodeExporter:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

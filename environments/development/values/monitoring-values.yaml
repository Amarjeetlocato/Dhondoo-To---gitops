kube-prometheus-stack:

  crds:
    enabled: true

  prometheusOperator:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  prometheus:
    enabled: true
    prometheusSpec:
      replicas: 1
      retention: 2d
      scrapeInterval: 30s
      evaluationInterval: 30s
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector:
        matchLabels:
          release: monitoring-dev
      serviceMonitorNamespaceSelector: {}
      ruleSelectorNilUsesHelmValues: false
      ruleSelector:
        matchLabels:
          release: monitoring-dev
      ruleNamespaceSelector: {}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 1
      alertmanagerConfigSelector: {}
      alertmanagerConfigNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring-dev
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi

  grafana:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  kubeStateMetrics:
    enabled: true

  kube-state-metrics:
    prometheus:
      monitor:
        additionalLabels:
          app.kubernetes.io/part-of: dhondoo

  kubelet:
    serviceMonitor:
      additionalLabels:
        app.kubernetes.io/part-of: dhondoo

  nodeExporter:
    enabled: false
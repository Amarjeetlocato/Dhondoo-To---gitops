# environments/development/values/order-service-values.yaml
#
replicaCount: 1
springProfile: kubernetes
timezone: UTC

image:
  repository: whomaiamar/order-service
  tag: c2796938af77b7b113babfbf841e043c8dad277e
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8086
  targetPort: 8086

env:
  - name: KAFKA_USERNAME
    valueFrom:
      secretKeyRef:
        name: order-service-kafka-secret
        key: KAFKA_USERNAME

  - name: KAFKA_PASSWORD
    valueFrom:
      secretKeyRef:
        name: order-service-kafka-secret
        key: KAFKA_PASSWORD

  - name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP

  - name: EUREKA_INSTANCE_IP_ADDRESS
    value: "$(POD_IP)"

  - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
    value: "true"

configMap:
  commonName: common-config
  existingName: order-service-config

secret:
  commonName: common-secret
  existingName: order-service-secret

serviceAccount:
  create: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "500m"
    memory: 512Mi

autoscaling:
  enabled: false

pdb:
  enabled: false

ingress:
  enabled: false

topologySpreadConstraints:
  enabled: false

podAntiAffinity:
  enabled: false

probes:
  startup:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 60
    successThreshold: 1

  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1

  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 20
    failureThreshold: 3
    successThreshold: 1

terminationGracePeriodSeconds: 30

lifecycle:
  enabled: true
  preStop:
    enabled: true
    command:
      - /bin/sh
      - -c
      - sleep 5

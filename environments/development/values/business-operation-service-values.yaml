replicaCount: 1
springProfile: development
timezone: UTC
env:
  - name: DB_URL
    value: "jdbc:mysql://mysql.database-dev.svc.cluster.local:3306/business_operation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true"
  - name: KAFKA_USERNAME
    valueFrom:
      secretKeyRef:
        name: user-service-kafka-secret
        key: KAFKA_USERNAME
  - name: KAFKA_PASSWORD
    valueFrom:
      secretKeyRef:
        name: user-service-kafka-secret
        key: KAFKA_PASSWORD
  - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
    value: SASL_PLAINTEXT
  - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
    value: SCRAM-SHA-512
  - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
    value: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="$(KAFKA_USERNAME)" password="$(KAFKA_PASSWORD)";'
image:
  repository: whomaiamar/business-operation-service
  tag: 1c1403db40bdc49be632a402f7b68662087383fe
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8090
  targetPort: 8090
configMap:
  enabled: true
  commonName: common-config
  existingName: business-operation-service-config
secret:
  enabled: false
  commonName: common-secret
  existingName: business-operation-service-secret
serviceAccount:
  create: true
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: false
pdb:
  enabled: false
probes:
  startup:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 36
    successThreshold: 1
  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1
  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 20
    failureThreshold: 3
    successThreshold: 1
terminationGracePeriodSeconds: 30
lifecycle:
  enabled: true
  preStop:
    enabled: true
    command:
      - /bin/sh
      - -c
      - sleep 5

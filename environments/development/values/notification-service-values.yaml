# environments/development/values/notification-service-values.yaml

replicaCount: 1

springProfile: kubernetes
timezone: UTC

image:
  repository: whomaiamar/notification-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8087
  targetPort: 8087

env:
  - name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP

  - name: EUREKA_INSTANCE_IP_ADDRESS
    value: "$(POD_IP)"

  - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
    value: "true"

configMap:
  commonName: common-config
  existingName: notification-service-config

secret:
  commonName: common-secret
  existingName: notification-service-secret

serviceAccount:
  create: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "500m"
    memory: 512Mi

autoscaling:
  enabled: false

pdb:
  enabled: false

ingress:
  enabled: false

topologySpreadConstraints:
  enabled: false

podAntiAffinity:
  enabled: false

probes:
  startup:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 60
    successThreshold: 1

  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1

  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 20
    failureThreshold: 3
    successThreshold: 1

terminationGracePeriodSeconds: 30

lifecycle:
  enabled: true
  preStop:
    enabled: true
    command:
      - /bin/sh
      - -c
      - sleep 5
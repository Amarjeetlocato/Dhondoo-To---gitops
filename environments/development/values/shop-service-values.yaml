# environments/development/values/shop-service-values.yaml
#
replicaCount: 1
springProfile: kubernetes
timezone: UTC
image:
  repository: whomaiamar/shop-service
  tag: 759fc8cc1efe307bb4e8e8402d8f70d9460ced9f
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8084
  targetPort: 8084
env:
  - name: KAFKA_USERNAME
    valueFrom:
      secretKeyRef:
        name: shop-service-kafka-secret
        key: KAFKA_USERNAME
  - name: KAFKA_PASSWORD
    valueFrom:
      secretKeyRef:
        name: shop-service-kafka-secret
        key: KAFKA_PASSWORD
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: "dhondoo-kafka-kafka-bootstrap.messaging.svc.cluster.local:9092"
  - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
    value: SASL_PLAINTEXT
  - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
    value: SCRAM-SHA-512
  - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
    value: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="$(KAFKA_USERNAME)" password="$(KAFKA_PASSWORD)";'
  - name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
  - name: EUREKA_INSTANCE_IP_ADDRESS
    value: "$(POD_IP)"
  - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
    value: "true"
configMap:
  commonName: common-config
  existingName: shop-service-config
secret:
  commonName: common-secret
  existingName: shop-service-secret
serviceAccount:
  create: true
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "500m"
    memory: 512Mi
autoscaling:
  enabled: false
pdb:
  enabled: false
ingress:
  enabled: false
topologySpreadConstraints:
  enabled: false
podAntiAffinity:
  enabled: false
probes:
  startup:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 60
    successThreshold: 1
  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1
  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 20
    failureThreshold: 3
    successThreshold: 1
terminationGracePeriodSeconds: 30
lifecycle:
  enabled: true
  preStop:
    enabled: true
    command:
      - /bin/sh
      - -c
      - sleep 5

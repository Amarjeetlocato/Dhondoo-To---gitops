replicaCount: 1
springProfile: development
timezone: UTC
env:
  - name: DB_URL
    value: "jdbc:mysql://mysql.database.svc.cluster.local:3306/dhondoo_billing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true"
  - name: KAFKA_USERNAME
    valueFrom:
      secretKeyRef:
        name: billing-service-secret
        key: KAFKA_USERNAME
  - name: KAFKA_PASSWORD
    valueFrom:
      secretKeyRef:
        name: billing-service-secret
        key: KAFKA_PASSWORD
image:
  repository: whomaiamar/billing-service
  tag: 759fc8cc1efe307bb4e8e8402d8f70d9460ced9f
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8089
  targetPort: 8089
configMap:
  enabled: true
  commonName: common-config
  existingName: billing-service-config
secret:
  enabled: true
  commonName: common-secret
  existingName: billing-service-secret
serviceAccount:
  create: true
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: false
pdb:
  enabled: false
probes:
  startup:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 36
    successThreshold: 1
  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1
  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 20
    failureThreshold: 3
    successThreshold: 1
terminationGracePeriodSeconds: 30
lifecycle:
  enabled: true
  preStop:
    enabled: true
    command:
      - /bin/sh
      - -c
      - sleep 5

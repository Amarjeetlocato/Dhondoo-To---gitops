# environments/development/values/mysql-values.yaml

replicaCount: 1

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3306
  targetPort: 3306

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "500m"
    memory: 1Gi

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClass: ""

mysql:
  database: dhondoo
  username: dhondoo
  password: ""
  rootPassword: ""

existingSecret: mysql-secret

probes:
  startup:
    enabled: true
    initialDelaySeconds: 15
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 36

  readiness:
    enabled: true
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6

  liveness:
    enabled: true
    initialDelaySeconds: 20
    timeoutSeconds: 5
    periodSeconds: 20
    failureThreshold: 3

terminationGracePeriodSeconds: 60

securityContext:
  runAsNonRoot: false

podSecurityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

podAntiAffinity:
  enabled: false

topologySpreadConstraints:
  enabled: false

pdb:
  enabled: false
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kafka
  namespace: argocd

spec:

  project: default

  source:

    repoURL: <YOUR_GITHUB_REPOSITORY>

    targetRevision: main

    path: infrastructure/kafka

  destination:

    server: https://kubernetes.default.svc

    namespace: messaging

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:

      - CreateNamespace=true
name: Kubernetes Manifest Validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Rendered Manifests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        chart:
          - service-registry
          - user-service
          - gateway
          - shop-service
          - order-service
          - notification-service
          - chat-service
          - superuser-service
          - mysql

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Build Dependencies
        run: |
          helm dependency build helm/${{ matrix.chart }} || true

      - name: Render Helm Chart
        run: |
          mkdir rendered
          helm template \
            ${{ matrix.chart }} \
            helm/${{ matrix.chart }} \
            > rendered/${{ matrix.chart }}.yaml

      - name: Validate Kubernetes Schema
        run: |
          kubeconform \
            -strict \
            -summary \
            rendered/${{ matrix.chart }}.yaml
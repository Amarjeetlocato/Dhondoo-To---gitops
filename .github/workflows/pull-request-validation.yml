name: GitOps Validation

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate GitOps Repository
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        chart:
          - service-registry
          - user-service
          - gateway
          - shop-service
          - order-service
          - notification-service
          - chat-service
          - superuser-service
          - mysql

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Build Helm Dependencies
        run: |
          helm dependency build helm/${{ matrix.chart }} || true

      - name: Helm Lint
        run: |
          helm lint helm/${{ matrix.chart }}

      - name: Helm Template
        run: |
          mkdir -p rendered
          helm template \
            ${{ matrix.chart }} \
            helm/${{ matrix.chart }} \
            > rendered/${{ matrix.chart }}.yaml

      - name: Kubernetes Schema Validation
        run: |
          kubeconform \
            -strict \
            -summary \
            rendered/${{ matrix.chart }}.yaml

      - name: Upload Rendered Manifest
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ matrix.chart }}
          path: rendered

  kustomize:
    name: Validate Kustomize
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - development
          - staging
          - production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Build Environment
        run: |
          kustomize build environments/${{ matrix.environment }}
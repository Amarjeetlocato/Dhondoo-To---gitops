name: Sealed Secrets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal-secrets:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # INSTALL KUBESEAL
      # ============================================================
      - name: Install kubeseal
        shell: bash
        run: |
          set -euo pipefail

          KUBESEAL_VERSION="0.39.1"

          curl -fsSL \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/kubeseal.tar.gz

          tar -xzf /tmp/kubeseal.tar.gz -C /tmp

          sudo install /tmp/kubeseal /usr/local/bin/kubeseal

          kubeseal --version

      # ============================================================
      # PREPARE TEMPORARY SECRETS
      # ============================================================
      - name: Prepare Temporary Secrets
        shell: bash
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          JWT_ADMIN_SECRET: ${{ secrets.JWT_ADMIN_SECRET }}
          JWT_USER_SECRET: ${{ secrets.JWT_USER_SECRET }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

          SUPERUSER_JWT_SECRET: ${{ secrets.JWT_ADMIN_SECRET }}
          # INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}

          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}

          USER_JWT_SECRET: ${{ secrets.JWT_USER_SECRET }}

          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          ALERTMANAGER_GMAIL_APP_PASSWORD: ${{ secrets.ALERTMANAGER_GMAIL_APP_PASSWORD }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
          UBER_CLIENT_ID: ${{ secrets.UBER_CLIENT_ID }}
          UBER_CLIENT_SECRET: ${{ secrets.UBER_CLIENT_SECRET }}
          UBER_CUSTOMER_ID: ${{ secrets.UBER_CUSTOMER_ID }}
        run: |
          set -euo pipefail

          : "${KAFKA_USERNAME:?KAFKA_USERNAME GitHub Environment Secret is missing}"
          : "${KAFKA_PASSWORD:?KAFKA_PASSWORD GitHub Environment Secret is missing}"
          : "${USER_JWT_SECRET:?JWT_SECRET GitHub Environment Secret is missing or empty}"
          : "${SUPERUSER_JWT_SECRET:?JWT_SECRET GitHub Environment Secret is missing or empty}"
          : "${UBER_CLIENT_ID:?UBER_CLIENT_ID GitHub Environment Secret is missing}"
          : "${UBER_CLIENT_SECRET:?UBER_CLIENT_SECRET GitHub Environment Secret is missing}"
          : "${UBER_CUSTOMER_ID:?UBER_CUSTOMER_ID GitHub Environment Secret is missing}"

          mkdir -p .tmp-secrets

          # Kafka credentials for all platform services
          for secret in \
            user-service-kafka-secret \
            shop-service-kafka-secret \
            order-service-kafka-secret \
            chat-kafka-secret \
            notification-kafka-secret
          do
            kubectl create secret generic "$secret" \
              --namespace platform \
              --from-literal=KAFKA_USERNAME="$KAFKA_USERNAME" \
              --from-literal=KAFKA_PASSWORD="$KAFKA_PASSWORD" \
              --dry-run=client \
              -o yaml \
              > ".tmp-secrets/${secret}.yaml"
          done

          # ----------------------------------------------------------
          # common-secret
          # ----------------------------------------------------------
          kubectl create secret generic common-secret \
            --namespace platform \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$MYSQL_PASSWORD" \
            --dry-run=client \
            -o yaml \
            > .tmp-secrets/common-secret.yaml

          # ----------------------------------------------------------
          # gateway-secret
          # ----------------------------------------------------------
          kubectl create secret generic gateway-secret \
            --namespace platform \
            --from-literal=JWT_ADMIN_SECRET="$JWT_ADMIN_SECRET" \
            --from-literal=JWT_USER_SECRET="$JWT_USER_SECRET" \
            --dry-run=client \
            -o yaml \
            > .tmp-secrets/gateway-secret.yaml

          # ----------------------------------------------------------
          # shop-service-secret
          # ----------------------------------------------------------
          kubectl create secret generic shop-service-secret \
            --namespace platform \
            --from-literal=CLOUDINARY_CLOUD_NAME="$CLOUDINARY_CLOUD_NAME" \
            --from-literal=CLOUDINARY_API_KEY="$CLOUDINARY_API_KEY" \
            --from-literal=CLOUDINARY_API_SECRET="$CLOUDINARY_API_SECRET" \
            --dry-run=client \
            -o yaml \
            > .tmp-secrets/shop-service-secret.yaml

          # ----------------------------------------------------------
          # superuser-service-secret
          # ----------------------------------------------------------
          kubectl create secret generic superuser-service-secret \
            --namespace platform \
            --from-literal=JWT_SECRET="$SUPERUSER_JWT_SECRET" \
            --dry-run=client \
            -o yaml \
            > .tmp-secrets/superuser-service-secret.yaml

          # ----------------------------------------------------------
          # user-service-secret
          # ----------------------------------------------------------
          kubectl create secret generic user-service-secret \
            --namespace platform \
            --from-literal=JWT_SECRET="$USER_JWT_SECRET" \
            --from-literal=SPRING_MAIL_USERNAME="$SPRING_MAIL_USERNAME" \
            --from-literal=SPRING_MAIL_PASSWORD="$SPRING_MAIL_PASSWORD" \
            --dry-run=client \
            -o yaml \
            > .tmp-secrets/user-service-secret.yaml

          # ----------------------------------------------------------
          # order-service-secret
          # ----------------------------------------------------------
          kubectl create secret generic order-service-secret \
            --namespace platform \
            --from-literal=UBER_CLIENT_ID="$UBER_CLIENT_ID" \
            --from-literal=UBER_CLIENT_SECRET="$UBER_CLIENT_SECRET" \
            --from-literal=UBER_CUSTOMER_ID="$UBER_CUSTOMER_ID" \
            --dry-run=client \
            -o yaml \
            > .tmp-secrets/order-service-secret.yaml

          # ----------------------------------------------------------
          # billing-service-secret
          # ----------------------------------------------------------
          kubectl create secret generic billing-service-secret \
            --namespace platform \
            --from-literal=RAZORPAY_KEY_ID="$RAZORPAY_KEY_ID" \
            --from-literal=RAZORPAY_KEY_SECRET="$RAZORPAY_KEY_SECRET" \
            --dry-run=client \
            -o yaml \
            > .tmp-secrets/billing-service-secret.yaml
          # ----------------------------------------------------------
          # business-operation-service-secret
          # ----------------------------------------------------------
          kubectl create secret generic business-operation-service-secret \
            --namespace platform \
            --from-literal=CLOUDINARY_CLOUD_NAME="${CLOUDINARY_CLOUD_NAME:-}" \
            --from-literal=CLOUDINARY_API_KEY="${CLOUDINARY_API_KEY:-}" \
            --from-literal=CLOUDINARY_API_SECRET="${CLOUDINARY_API_SECRET:-}" \
            --from-literal=KAFKA_USERNAME="$KAFKA_USERNAME" \
            --from-literal=KAFKA_PASSWORD="$KAFKA_PASSWORD" \
            --dry-run=client \
            -o yaml \
            > .tmp-secrets/business-operation-service-secret.yaml

          # ----------------------------------------------------------
          # mysql-secret
          # ----------------------------------------------------------
          kubectl create secret generic mysql-secret \
            --namespace database \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=MYSQL_DATABASE="dhondoo" \
            --from-literal=MYSQL_USER="dhondoo" \
            --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            --dry-run=client \
            -o yaml \
            > .tmp-secrets/mysql-secret.yaml

          # ----------------------------------------------------------
          # alertmanager-gmail-secret
          # ----------------------------------------------------------
          kubectl create secret generic alertmanager-gmail-secret \
            --namespace monitoring \
            --from-literal=alertmanager-gmail-app-password="$ALERTMANAGER_GMAIL_APP_PASSWORD" \
            --dry-run=client \
            -o yaml \
            > .tmp-secrets/alertmanager-gmail-secret.yaml

      # ============================================================
      # SEAL SECRETS
      # ============================================================
      - name: Seal Secrets
        shell: bash
        env:
          SEALED_SECRETS_CERT: ${{ vars.SEALED_SECRETS_CERT }}
        run: |
          set -euo pipefail

          if [ -z "$SEALED_SECRETS_CERT" ]; then
            echo "ERROR: SEALED_SECRETS_CERT is empty"
            exit 1
          fi

          mkdir -p infrastructure/namespaces/secrets
          mkdir -p helm/monitoring/templates

          printf '%s\n' "$SEALED_SECRETS_CERT" \
            > .tmp-secrets/sealed-secrets-cert.pem

          # Platform and database secrets
          for secret in \
            common-secret \
            gateway-secret \
            shop-service-secret \
            superuser-service-secret \
            user-service-secret \
            order-service-secret \
            billing-service-secret \
            business-operation-service-secret \
            user-service-kafka-secret \
            shop-service-kafka-secret \
            order-service-kafka-secret \
            chat-kafka-secret \
            notification-kafka-secret \
            mysql-secret
          do
            echo "Sealing ${secret}..."

            kubeseal \
              --format yaml \
              --cert .tmp-secrets/sealed-secrets-cert.pem \
              < ".tmp-secrets/${secret}.yaml" \
              > "infrastructure/namespaces/secrets/${secret}.yaml"
          done

          # Monitoring secret
          echo "Sealing alertmanager-gmail-secret..."

          kubeseal \
            --format yaml \
            --cert .tmp-secrets/sealed-secrets-cert.pem \
            < .tmp-secrets/alertmanager-gmail-secret.yaml \
            > helm/monitoring/templates/alertmanager-gmail-secret.yaml

      # ============================================================
      # CLEAN PLAINTEXT FILES
      # ============================================================
      - name: Remove Temporary Plaintext Secrets
        if: always()
        shell: bash
        run: |
          rm -rf .tmp-secrets

      # ============================================================
      # VERIFY SEALED SECRETS
      # ============================================================
      - name: Verify Sealed Secrets
        shell: bash
        run: |
          set -euo pipefail

          for secret in \
            common-secret \
            gateway-secret \
            shop-service-secret \
            superuser-service-secret \
            user-service-secret \
            billing-service-secret \
            business-operation-service-secret \
            user-service-kafka-secret \
            shop-service-kafka-secret \
            order-service-kafka-secret \
            chat-kafka-secret \
            notification-kafka-secret \
            mysql-secret
          do
            file="infrastructure/namespaces/secrets/${secret}.yaml"

            echo "Checking ${file}..."

            if [ ! -f "$file" ]; then
              echo "ERROR: Missing ${file}"
              exit 1
            fi

            if ! grep -q "kind: SealedSecret" "$file"; then
              echo "ERROR: ${file} is not a SealedSecret"
              exit 1
            fi

            if grep -q "stringData:" "$file" || grep -qE '^[[:space:]]+data:' "$file"; then
              echo "ERROR: Plaintext data detected in ${file}"
              exit 1
            fi

            if ! grep -q "encryptedData:" "$file"; then
              echo "ERROR: encryptedData missing in ${file}"
              exit 1
            fi
          done

          # Monitoring secret
          file="helm/monitoring/templates/alertmanager-gmail-secret.yaml"

          echo "Checking ${file}..."

          if [ ! -f "$file" ]; then
            echo "ERROR: Missing ${file}"
            exit 1
          fi

          if ! grep -q "kind: SealedSecret" "$file"; then
            echo "ERROR: ${file} is not a SealedSecret"
            exit 1
          fi

          if grep -q "stringData:" "$file" || grep -qE '^[[:space:]]+data:' "$file"; then
            echo "ERROR: Plaintext data detected in ${file}"
            exit 1
          fi

          if ! grep -q "encryptedData:" "$file"; then
            echo "ERROR: encryptedData missing in ${file}"
            exit 1
          fi

          echo "All production secrets are sealed."

      # ============================================================
      # COMMIT
      # ============================================================
      - name: Commit Sealed Secrets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Dhondoo GitOps Bot"
          git config user.email "actions@github.com"

          git add infrastructure/namespaces/secrets/
          git add helm/monitoring/templates/alertmanager-gmail-secret.yaml

          if git diff --cached --quiet; then
            echo "No sealed secret changes detected."
            exit 0
          fi

          git commit -m "ci: update production sealed secrets"
     
      # ============================================================
      # PUSH CHANGES (RETRY + FETCH + REBASE)
      # ============================================================
      - name: Push Changes
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "Push attempt: $attempt"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Sealed Secrets pushed successfully."
              exit 0
            fi

            echo "Push failed. Retrying after fetching latest main..."
            sleep 3
          done

          echo "ERROR: Unable to push after 5 attempts."
          exit 1



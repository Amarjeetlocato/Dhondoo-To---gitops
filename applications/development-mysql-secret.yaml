apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: development-mysql-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Amarjeetlocato/Dhondoo-To---gitops.git
    targetRevision: main
    path: environments/development/secrets/database
  destination:
    server: https://kubernetes.default.svc
    namespace: database-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

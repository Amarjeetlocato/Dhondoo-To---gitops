apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-cluster
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Amarjeetlocato/Dhondoo-To---gitops.git
    targetRevision: main
    path: infrastructure/kafka

  destination:
    server: https://kubernetes.default.svc
    namespace: messaging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-operator
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.47.0

    helm:
      releaseName: strimzi

      values: |
        watchAnyNamespace: true

        livenessProbe:
          initialDelaySeconds: 60
          periodSeconds: 30

        readinessProbe:
          initialDelaySeconds: 60
          periodSeconds: 30

        resources:
          requests:
            cpu: 300m
            memory: 384Mi

          limits:
            cpu: 1
            memory: 768Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: messaging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
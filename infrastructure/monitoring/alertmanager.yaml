# infrastructure/monitoring/alertmanager.yaml

apiVersion: monitoring.coreos.com/v1
kind: Alertmanager

metadata:
  name: dhondoo-alertmanager
  namespace: monitoring

spec:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
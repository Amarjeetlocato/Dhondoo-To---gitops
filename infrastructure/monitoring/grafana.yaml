# infrastructure/monitoring/grafana.yaml

apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: monitoring

  labels:
    app: grafana
    app.kubernetes.io/part-of: dhondoo

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/part-of: dhondoo

    spec:
      securityContext:
        fsGroup: 472

      containers:
        - name: grafana

          image: grafana/grafana:12.1.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            allowPrivilegeEscalation: false
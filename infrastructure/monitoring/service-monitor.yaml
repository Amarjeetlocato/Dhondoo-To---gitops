# infrastructure/monitoring/service-monitor.yaml

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: dhondoo-platform
  namespace: monitoring

  labels:
    app.kubernetes.io/part-of: dhondoo
    release: kube-prometheus-stack

spec:
  namespaceSelector:
    matchNames:
      - platform

  selector:
    matchLabels:
      app.kubernetes.io/part-of: dhondoo

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s

      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_name
          targetLabel: pod

        - sourceLabels:
            - __meta_kubernetes_namespace
          targetLabel: namespace

        - sourceLabels:
            - __meta_kubernetes_service_name
          targetLabel: service
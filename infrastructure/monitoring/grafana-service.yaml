# infrastructure/monitoring/grafana-service.yaml

apiVersion: v1
kind: Service

metadata:
  name: grafana
  namespace: monitoring

  labels:
    app: grafana
    app.kubernetes.io/part-of: dhondoo

spec:
  type: ClusterIP

  selector:
    app: grafana

  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dhondoo-kafka-pool
  namespace: messaging
  labels:
    strimzi.io/cluster: dhondoo-kafka
spec:
  replicas: 3

  roles:
    - broker
    - controller

  storage:
    type: persistent-claim

    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        deleteClaim: false
        kraftMetadata: shared

  resources:
    requests:
      cpu: 500m
      memory: 1Gi

    limits:
      cpu: "2"
      memory: 2Gi

  jvmOptions:
    "-Xms": "512m"
    "-Xmx": "1g"

  template:
    pod:
      metadata:
        labels:
          app: kafka
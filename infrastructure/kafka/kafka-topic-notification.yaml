apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: notification-events
  namespace: messaging
  labels:
    strimzi.io/cluster: dhondoo-kafka
spec:
  topicName: notification-events
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: 604800000
    segment.bytes: 1073741824
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-credentials-sync
  namespace: database-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-sync
          image: mysql:8.0
          envFrom:
            - secretRef:
                name: mysql-secret
          command:
            - /bin/sh
            - -c
            - |
              echo "Synchronizing MySQL User Credentials and Privileges..."
              mysql -h mysql.database-dev.svc.cluster.local -u root -p"$MYSQL_ROOT_PASSWORD" -e "ALTER USER '$MYSQL_USER'@'%' IDENTIFIED WITH mysql_native_password BY '$MYSQL_PASSWORD'; CREATE USER IF NOT EXISTS 'whoami'@'%' IDENTIFIED WITH mysql_native_password BY '$MYSQL_PASSWORD'; GRANT ALL PRIVILEGES ON *.* TO '$MYSQL_USER'@'%'; GRANT ALL PRIVILEGES ON *.* TO 'whoami'@'%'; FLUSH PRIVILEGES;"
              echo "MySQL User Credentials & Privileges Synchronized Successfully!"

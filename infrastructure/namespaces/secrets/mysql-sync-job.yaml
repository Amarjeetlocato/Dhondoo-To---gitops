apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-credentials-sync
  namespace: database-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-sync
          image: mysql:8.0
          envFrom:
            - secretRef:
                name: mysql-secret
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "=== Starting MySQL Credentials & Privileges Synchronization ==="
              MYSQL_HOST="mysql.database-dev.svc.cluster.local"
              
              echo "Waiting for MySQL server connectivity..."
              for i in $(seq 1 30); do
                if mysqladmin ping -h "$MYSQL_HOST" -u root -p"$MYSQL_ROOT_PASSWORD" --silent; then
                  echo "Connected to MySQL on $MYSQL_HOST"
                  break
                fi
                echo "Waiting for MySQL... ($i/30)"
                sleep 2
              done

              mysql -h "$MYSQL_HOST" -u root -p"$MYSQL_ROOT_PASSWORD" <<EOF
              CREATE DATABASE IF NOT EXISTS \`dhondoo\`;

              -- Synchronize configured MYSQL_USER (${MYSQL_USER})
              CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
              ALTER USER '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
              GRANT ALL PRIVILEGES ON *.* TO '${MYSQL_USER}'@'%' WITH GRANT OPTION;

              -- Synchronize common aliases (whoami, dhondoo)
              CREATE USER IF NOT EXISTS 'whoami'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
              ALTER USER 'whoami'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
              GRANT ALL PRIVILEGES ON *.* TO 'whoami'@'%' WITH GRANT OPTION;

              CREATE USER IF NOT EXISTS 'dhondoo'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
              ALTER USER 'dhondoo'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
              GRANT ALL PRIVILEGES ON *.* TO 'dhondoo'@'%' WITH GRANT OPTION;

              FLUSH PRIVILEGES;
              EOF

              echo "=== MySQL Credentials & Privileges Synchronized Successfully! ==="

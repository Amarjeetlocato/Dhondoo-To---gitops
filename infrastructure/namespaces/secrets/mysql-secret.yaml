---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mysql-secret
  namespace: database
spec:
  encryptedData:
    MYSQL_DATABASE: 
    MYSQL_PASSWORD: 
    MYSQL_ROOT_PASSWORD: 
    MYSQL_USER: 
  template:
    metadata:
      annotations:
        argocd.argoproj.io/tracking-id: mysql:/Secret:database/mysql-secret
      name: mysql-secret
      namespace: database
    type: Opaque

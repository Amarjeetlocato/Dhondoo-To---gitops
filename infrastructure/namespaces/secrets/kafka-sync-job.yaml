apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-credentials-sync
  namespace: messaging
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-sync
          image: quay.io/strimzi/kafka:0.45.0-kafka-3.9.0
          env:
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-service-kafka-secret
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-kafka-secret
                  key: KAFKA_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              echo "Synchronizing Kafka SASL SCRAM User Credentials..."
              
              /opt/kafka/bin/kafka-configs.sh \
                --bootstrap-server dhondoo-kafka-kafka-bootstrap.messaging.svc.cluster.local:9092 \
                --entity-type users \
                --entity-name "$KAFKA_USERNAME" \
                --alter \
                --add-config "SCRAM-SHA-512=[password=$KAFKA_PASSWORD]"

              echo "Kafka SASL SCRAM User Credentials Synchronized Successfully!"

apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-credentials-sync
  namespace: messaging
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-sync
          image: quay.io/strimzi/kafka:0.45.0-kafka-3.9.0
          env:
            - name: SHOP_USER
              valueFrom:
                secretKeyRef:
                  name: shop-service-kafka-secret
                  key: KAFKA_USERNAME
            - name: SHOP_PASS
              valueFrom:
                secretKeyRef:
                  name: shop-service-kafka-secret
                  key: KAFKA_PASSWORD
            - name: USER_USER
              valueFrom:
                secretKeyRef:
                  name: user-service-kafka-secret
                  key: KAFKA_USERNAME
            - name: USER_PASS
              valueFrom:
                secretKeyRef:
                  name: user-service-kafka-secret
                  key: KAFKA_PASSWORD
            - name: ORDER_USER
              valueFrom:
                secretKeyRef:
                  name: order-service-kafka-secret
                  key: KAFKA_USERNAME
            - name: ORDER_PASS
              valueFrom:
                secretKeyRef:
                  name: order-service-kafka-secret
                  key: KAFKA_PASSWORD
            - name: CHAT_USER
              valueFrom:
                secretKeyRef:
                  name: chat-kafka-secret
                  key: KAFKA_USERNAME
            - name: CHAT_PASS
              valueFrom:
                secretKeyRef:
                  name: chat-kafka-secret
                  key: KAFKA_PASSWORD
            - name: NOTIF_USER
              valueFrom:
                secretKeyRef:
                  name: notification-kafka-secret
                  key: KAFKA_USERNAME
            - name: NOTIF_PASS
              valueFrom:
                secretKeyRef:
                  name: notification-kafka-secret
                  key: KAFKA_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              echo "Synchronizing Kafka SASL SCRAM User Credentials for all microservices..."
              
              BS="dhondoo-kafka-kafka-bootstrap.messaging.svc.cluster.local:9092"
              
              /opt/kafka/bin/kafka-configs.sh --bootstrap-server $BS --entity-type users --entity-name "$SHOP_USER" --alter --add-config "SCRAM-SHA-512=[password=$SHOP_PASS]" || true
              /opt/kafka/bin/kafka-configs.sh --bootstrap-server $BS --entity-type users --entity-name "$USER_USER" --alter --add-config "SCRAM-SHA-512=[password=$USER_PASS]" || true
              /opt/kafka/bin/kafka-configs.sh --bootstrap-server $BS --entity-type users --entity-name "$ORDER_USER" --alter --add-config "SCRAM-SHA-512=[password=$ORDER_PASS]" || true
              /opt/kafka/bin/kafka-configs.sh --bootstrap-server $BS --entity-type users --entity-name "$CHAT_USER" --alter --add-config "SCRAM-SHA-512=[password=$CHAT_PASS]" || true
              /opt/kafka/bin/kafka-configs.sh --bootstrap-server $BS --entity-type users --entity-name "$NOTIF_USER" --alter --add-config "SCRAM-SHA-512=[password=$NOTIF_PASS]" || true

              echo "All Kafka SASL SCRAM User Credentials Synchronized Successfully!"

apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-credentials-sync
  namespace: platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-sync
          image: quay.io/strimzi/kafka:0.45.0-kafka-3.9.0
          env:
            - name: KAFKA_USER
              valueFrom:
                secretKeyRef:
                  name: shop-service-kafka-secret
                  key: KAFKA_USERNAME
            - name: KAFKA_PASS
              valueFrom:
                secretKeyRef:
                  name: shop-service-kafka-secret
                  key: KAFKA_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "=== Starting Kafka Credentials & ACLs Synchronization ==="
              echo "Target User: $KAFKA_USER"
              
              BS_ADMIN="dhondoo-kafka-kafka-bootstrap.messaging.svc.cluster.local:9094"
              BS_PLAIN="dhondoo-kafka-kafka-bootstrap.messaging.svc.cluster.local:9092"
              
              BS=""
              CMD_CONFIG=""
              
              echo "Checking Kafka connectivity..."
              for i in $(seq 1 30); do
                if /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server "$BS_ADMIN" >/dev/null 2>&1; then
                  echo "Connected via Admin Listener on $BS_ADMIN (Unauthenticated / SuperUser)"
                  BS="$BS_ADMIN"
                  CMD_CONFIG=""
                  break
                elif /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server "$BS_PLAIN" >/dev/null 2>&1; then
                  echo "Connected via Plain Listener on $BS_PLAIN"
                  BS="$BS_PLAIN"
                  cat <<EOF > /tmp/admin.properties
              security.protocol=SASL_PLAINTEXT
              sasl.mechanism=SCRAM-SHA-512
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="dhondoo-services" password="$KAFKA_PASS";
              EOF
                  CMD_CONFIG="--command-config /tmp/admin.properties"
                  break
                fi
                echo "Waiting for Kafka bootstrap service... ($i/30)"
                sleep 2
              done

              if [ -z "$BS" ]; then
                echo "ERROR: Unable to reach Kafka on port 9094 or 9092."
                exit 1
              fi

              echo "1. Registering/Updating SCRAM-SHA-512 credentials for: $KAFKA_USER"
              /opt/kafka/bin/kafka-configs.sh --bootstrap-server "$BS" $CMD_CONFIG \
                --entity-type users --entity-name "$KAFKA_USER" \
                --alter --add-config "SCRAM-SHA-512=[password=$KAFKA_PASS]"

              echo "2. Registering/Updating SCRAM-SHA-512 credentials for: dhondoo-services"
              /opt/kafka/bin/kafka-configs.sh --bootstrap-server "$BS" $CMD_CONFIG \
                --entity-type users --entity-name "dhondoo-services" \
                --alter --add-config "SCRAM-SHA-512=[password=$KAFKA_PASS]" || true

              echo "3. Granting Cluster & Topic ACLs for User:$KAFKA_USER"
              /opt/kafka/bin/kafka-acls.sh --bootstrap-server "$BS" $CMD_CONFIG \
                --add --allow-principal "User:$KAFKA_USER" --operation All --topic "*" --group "*" --cluster || true

              echo "4. Granting Wildcard Topic & Group ACLs for all authenticated users"
              /opt/kafka/bin/kafka-acls.sh --bootstrap-server "$BS" $CMD_CONFIG \
                --add --allow-principal "User:*" --operation All --topic "*" --group "*" || true

              echo "=== Kafka Synchronization Completed Successfully! ==="

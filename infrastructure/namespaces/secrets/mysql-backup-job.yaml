apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-pre-deploy-backup
  namespace: database-dev
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-backup
          image: mysql:8.0
          envFrom:
            - secretRef:
                name: mysql-secret
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              echo "=== STARTING AUTOMATED PRE-SYNC DATABASE BACKUP SNAPSHOT ==="
              echo "Backup timestamp: ${TIMESTAMP}"
              
              mysqldump -h mysql.database-dev.svc.cluster.local -u root -p"$MYSQL_ROOT_PASSWORD" \
                --all-databases --single-transaction --quick \
                | gzip > /tmp/dhondoo_db_backup_${TIMESTAMP}.sql.gz

              BACKUP_SIZE=$(ls -lh /tmp/dhondoo_db_backup_${TIMESTAMP}.sql.gz | awk '{print $5}')
              echo "✅ PRE-SYNC BACKUP COMPLETED: /tmp/dhondoo_db_backup_${TIMESTAMP}.sql.gz (Size: ${BACKUP_SIZE})"

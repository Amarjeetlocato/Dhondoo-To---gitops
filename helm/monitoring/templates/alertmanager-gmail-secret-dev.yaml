{{- if eq .Release.Name "monitoring-dev" }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-gmail-secret
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    alertmanager-gmail-app-password: <DEV_CIPHERTEXT_PENDING_OPERATOR_SEALING>
  template:
    metadata:
      name: alertmanager-gmail-secret
      namespace: {{ .Release.Namespace }}
{{- end }}

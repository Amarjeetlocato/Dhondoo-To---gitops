apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dhondoo-platform-services
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dhondoo-platform-monitoring
    app.kubernetes.io/part-of: dhondoo
    release: {{ .Release.Name }}
spec:
  namespaceSelector:
    matchNames:
      - platform
  selector:
    matchLabels:
      app.kubernetes.io/part-of: dhondoo
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      scheme: http

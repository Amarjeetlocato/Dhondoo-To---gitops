apiVersion: monitoring.coreos.com/v1

kind: PrometheusRule

metadata:

  name: dhondoo-platform-alerts

  namespace: {{ .Release.Namespace }}

  labels:

    app.kubernetes.io/name: dhondoo-platform-alerts

    app.kubernetes.io/part-of: dhondoo

    release: {{ .Release.Name }}

spec:

  groups:

    # ========================================================
    # POD HEALTH
    # ========================================================

    - name: dhondoo.pods

      rules:

        - alert: DhondooPodCrashLooping

          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace="platform"
              }[15m]
            ) > 3

          for: 5m

          labels:

            severity: critical

            team: dhondoo

          annotations:

            summary: Dhondoo pod is repeatedly restarting

            description: >
              A Dhondoo platform container restarted more than
              three times during the last fifteen minutes.

        - alert: DhondooPodNotReady

          expr: |
            kube_pod_status_ready{
              namespace="platform",
              condition="true"
            } == 0

          for: 10m

          labels:

            severity: warning

            team: dhondoo

          annotations:

            summary: Dhondoo pod is not ready

            description: >
              A Dhondoo platform pod has remained unready
              for more than ten minutes.

        - alert: DhondooDeploymentUnavailable

          expr: |
            kube_deployment_status_replicas_available{
              namespace="platform"
            }
            <
            kube_deployment_spec_replicas{
              namespace="platform"
            }

          for: 10m

          labels:

            severity: critical

            team: dhondoo

          annotations:

            summary: Dhondoo deployment has unavailable replicas

            description: >
              One or more desired Dhondoo platform replicas
              are unavailable.

    # ========================================================
    # CPU
    # ========================================================

    - name: dhondoo.resources

      rules:

        - alert: DhondooHighCPU

          expr: |
            (
              sum by (namespace, pod) (
                rate(
                  container_cpu_usage_seconds_total{
                    namespace="platform",
                    container!="",
                    container!="POD"
                  }[5m]
                )
              )
            )
            /
            (
              sum by (namespace, pod) (
                kube_pod_container_resource_requests{
                  namespace="platform",
                  resource="cpu",
                  unit="core"
                }
              )
            )
            > 0.85

          for: 10m

          labels:

            severity: warning

            team: dhondoo

          annotations:

            summary: Dhondoo pod CPU usage is high

            description: >
              CPU usage has exceeded 85 percent of the
              requested CPU for ten minutes.

        # ====================================================
        # MEMORY
        # ====================================================

        - alert: DhondooHighMemory

          expr: |
            (
              sum by (namespace, pod) (
                container_memory_working_set_bytes{
                  namespace="platform",
                  container!="",
                  container!="POD"
                }
              )
            )
            /
            (
              sum by (namespace, pod) (
                kube_pod_container_resource_requests{
                  namespace="platform",
                  resource="memory",
                  unit="byte"
                }
              )
            )
            > 0.85

          for: 10m

          labels:

            severity: warning

            team: dhondoo

          annotations:

            summary: Dhondoo pod memory usage is high

            description: >
              Memory usage has exceeded 85 percent of the
              requested memory for ten minutes.

    # ========================================================
    # JVM
    # ========================================================

    - name: dhondoo.jvm

      rules:

        - alert: DhondooJVMHighHeap

          expr: |
            (
              jvm_memory_used_bytes{
                namespace="platform",
                area="heap"
              }
              /
              jvm_memory_max_bytes{
                namespace="platform",
                area="heap"
              }
            ) > 0.85

          for: 10m

          labels:

            severity: warning

            team: dhondoo

          annotations:

            summary: Dhondoo JVM heap usage is high

            description: >
              JVM heap usage has exceeded 85 percent
              for ten minutes.

    # ========================================================
    # KAFKA, JDBC & GATEWAY FAILURES
    # ========================================================

    - name: dhondoo.services

      rules:

        - alert: DhondooKafkaAuthFailed

          expr: |
            increase(kafka_producer_record_error_total[5m]) > 0
            or
            increase(spring_kafka_listener_seconds_count{exception!="none"}[5m]) > 0
            or
            increase(kafka_server_socketserver_failedauthenticationtotal[5m]) > 0
            or
            increase(kube_pod_container_status_restarts_total{namespace="platform"}[15m]) > 0

          for: 1m

          labels:

            severity: critical

            team: dhondoo

          annotations:

            summary: Kafka SASL/SCRAM authentication failure or connection lost

            description: >
              A Dhondoo microservice failed to authenticate with Kafka brokers via SCRAM-SHA-512 or message delivery failed.

        - alert: DhondooServiceHTTP5xxError

          expr: |
            sum by (namespace, app_kubernetes_io_name, uri, exception) (
              increase(http_server_requests_seconds_count{namespace="platform", status=~"5.."}[3m])
            ) > 0

          for: 30s

          labels:

            severity: critical

            team: dhondoo

          annotations:

            summary: "HTTP 500 Server Error in {{ $labels.app_kubernetes_io_name || $labels.job }}"

            description: >
              Microservice {{ $labels.app_kubernetes_io_name || $labels.job }} encountered a 500 error on endpoint {{ $labels.uri }}. Exception: {{ $labels.exception }}

        - alert: DhondooServiceUnhealthy

          expr: |
            kube_pod_status_ready{namespace="platform", condition="false"} == 1

          for: 1m

          labels:

            severity: critical

            team: dhondoo

          annotations:

            summary: "Microservice Unhealthy: {{ $labels.pod }}"

            description: >
              Pod {{ $labels.pod }} in platform namespace is failing readiness probes or is not ready.

        - alert: DhondooJDBCConnectionFailed

          expr: |
            increase(hikaricp_connections_timeout_total{namespace="platform"}[5m]) > 0

          for: 2m

          labels:

            severity: critical

            team: dhondoo

          annotations:

            summary: JDBC Database Connection Failed / HikariCP Timeout

            description: >
              MySQL JDBC connection pool timeout or HikariCP connections exhausted for a microservice.

        - alert: DhondooGatewayHigh5xxErrors

          expr: |
            sum(rate(spring_cloud_gateway_requests_seconds_count{status=~"5.*"}[5m])) > 1

          for: 2m

          labels:

            severity: critical

            team: dhondoo

          annotations:

            summary: High 5xx HTTP Error Rate on API Gateway

            description: >
              API Gateway is returning 500/502/503 errors to incoming user requests.

        - alert: DhondooMySQLPodFailed

          expr: |
            kube_pod_status_ready{namespace="database-dev", pod=~".*mysql.*", condition="true"} == 0

          for: 2m

          labels:

            severity: critical

            team: dhondoo

          annotations:

            summary: MySQL Database Pod Down or Unready

            description: >
              MySQL database pod in database-dev namespace is unready or unreachable.
    # ========================================================
    # HOST / VPS HEALTH
    # ========================================================

    - name: dhondoo.host

      rules:

        - alert: DhondooHostHighCPU

          expr: |
            (
              100 * (
                1 - avg by (instance) (
                  rate(node_cpu_seconds_total{
                    job="node-exporter",
                    mode="idle"
                  }[5m])
                )
              )
            ) > 85

          for: 10m

          labels:
            severity: warning
            team: dhondoo
            namespace: monitoring

          annotations:
            summary: VPS CPU usage is high
            description: Host CPU usage has exceeded 85 percent for ten minutes.

        - alert: DhondooRootDiskLowSpace

          expr: |
            (
              node_filesystem_avail_bytes{
                job="node-exporter",
                mountpoint="/",
                fstype="ext4"
              }
              /
              node_filesystem_size_bytes{
                job="node-exporter",
                mountpoint="/",
                fstype="ext4"
              }
            ) * 100 < 15
            and
            node_filesystem_readonly{
              job="node-exporter",
              mountpoint="/",
              fstype="ext4"
            } == 0

          for: 5m

          labels:
            severity: warning
            team: dhondoo
            namespace: monitoring

          annotations:
            summary: VPS root disk space is low
            description: Less than 15 percent free space remains on the root filesystem.

        - alert: DhondooSwapHighUsage

          expr: |
            (
              (
                node_memory_SwapTotal_bytes{job="node-exporter"}
                -
                node_memory_SwapFree_bytes{job="node-exporter"}
              )
              /
              node_memory_SwapTotal_bytes{job="node-exporter"}
            ) * 100 > 50
            and
            node_memory_SwapTotal_bytes{job="node-exporter"} > 0

          for: 5m

          labels:
            severity: warning
            team: dhondoo
            namespace: monitoring

          annotations:
            summary: VPS swap usage is high
            description: More than 50 percent of available swap has been used for five minutes.

        - alert: DhondooNodeExporterDown

          expr: |
            up{job="node-exporter"} == 0

          for: 3m

          labels:
            severity: critical
            team: dhondoo
            namespace: monitoring

          annotations:
            summary: Node Exporter is down
            description: Prometheus cannot scrape the VPS Node Exporter for three minutes.

        - alert: DhondooNodeExporterMissing

          expr: |
            absent(up{job="node-exporter"})

          for: 3m

          labels:
            severity: critical
            team: dhondoo
            namespace: monitoring

          annotations:
            summary: Node Exporter target is missing
            description: The Node Exporter target is missing from Prometheus service discovery.

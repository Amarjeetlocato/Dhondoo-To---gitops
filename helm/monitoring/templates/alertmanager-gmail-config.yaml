apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: dhondoo-gmail-alerts
  namespace: {{ .Release.Namespace }}
spec:
  route:
    receiver: gmail
    groupBy:
      - alertname
      - namespace
      - pod
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
  receivers:
    - name: gmail
      emailConfigs:
        - to: dhondooto@gmail.com
          from: dhondooto@gmail.com
          authUsername: dhondooto@gmail.com
          smarthost: smtp.gmail.com:587
          requireTLS: true
          sendResolved: true
          authPassword:
            name: alertmanager-gmail-secret
            key: alertmanager-gmail-app-password

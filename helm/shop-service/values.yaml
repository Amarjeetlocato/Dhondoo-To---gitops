replicaCount: 1

springProfile: kubernetes

timezone: UTC

image:

  repository: whomaiamar/shop-service

  tag: latest

  pullPolicy: IfNotPresent

service:

  type: ClusterIP

  port: 8084

  targetPort: 8084

configMap:

  enabled: true

  data:

    SPRING_APPLICATION_NAME: shop-service

    SERVER_PORT: "8084"

    EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"

    EUREKA_CLIENT_FETCH_REGISTRY: "false"

secret:

  enabled: false

serviceAccount:

  create: true

resources:

  requests:

    cpu: 250m

    memory: 512Mi

  limits:

    cpu: "1"

    memory: 1Gi

autoscaling:

  enabled: false

pdb:

  enabled: false

ingress:

  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

imagePullSecrets: []

podAnnotations: {}

probes:

  liveness:

    path: /actuator/health/liveness

    initialDelaySeconds: 60

    periodSeconds: 10

  readiness:

    path: /actuator/health/readiness

    initialDelaySeconds: 30

    periodSeconds: 5

  startup:

    path: /actuator/health

    failureThreshold: 30

    periodSeconds: 10
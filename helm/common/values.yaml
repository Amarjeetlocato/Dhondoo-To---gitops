# helm/common/values.yaml

replicaCount: 1

springProfile: kubernetes
timezone: UTC

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

configMap:
  enabled: false
  data: {}

secret:
  enabled: false
  data: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

containerSecurityContext:
  enabled: true
  capabilities:
    drop:
      - ALL

probes:
  startup:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 36
    successThreshold: 1

  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1

  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 20
    failureThreshold: 3
    successThreshold: 1

lifecycle:
  enabled: true
  preStop:
    enabled: true
    command:
      - /bin/sh
      - -c
      - sleep 5

terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

minReadySeconds: 10

revisionHistoryLimit: 10

java:
  enabled: true
  options: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=25 -XX:+UseG1GC"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

  behavior:
    enabled: true

    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

podAntiAffinity:
  enabled: false
  type: preferred
  weight: 100
  topologyKey: kubernetes.io/hostname

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

nodeSelector: {}

tolerations: []

affinity: {}

env: []

envFrom: []

extraVolumes: []

extraVolumeMounts: []
replicaCount: 1

springProfile: kubernetes

timezone: UTC

image:

  repository: whomaiamar/service-registry


  tag: "1.0.2"

  pullPolicy: IfNotPresent

service:

  type: ClusterIP

  port: 8761

  targetPort: 8761

configMap:

  enabled: true

  data:

    SPRING_APPLICATION_NAME: eureka

    SERVER_PORT: "8761"

    EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"

    EUREKA_CLIENT_FETCH_REGISTRY: "false"

secret:

  enabled: false

serviceAccount:

  create: true

resources:

  requests:

    cpu: 250m

    memory: 512Mi

  limits:

    cpu: "1"

    memory: 1Gi

autoscaling:

  enabled: false

pdb:

  enabled: false

ingress:

  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

imagePullSecrets: []

podAnnotations: {}

probes:

  liveness:

    path: /actuator/health/liveness

    initialDelaySeconds: 60

    periodSeconds: 10

  readiness:

    path: /actuator/health/readiness

    initialDelaySeconds: 30

    periodSeconds: 5

  startup:

    path: /actuator/health

    failureThreshold: 30

    periodSeconds: 10


    securityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
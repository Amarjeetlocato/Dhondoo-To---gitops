replicaCount: 1

springProfile: kubernetes
timezone: UTC

image:
  repository: whomaiamar/gateway
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8079
  targetPort: 8079

configMap:
  enabled: true
  data:
    SPRING_APPLICATION_NAME: "gateway"
    SERVER_PORT: "8079"
    SERVER_ADDRESS: "0.0.0.0"

    EUREKA_SERVER: "http://service-registry-service-registry.platform.svc.cluster.local:8761/eureka/"
    EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://service-registry-service-registry.platform.svc.cluster.local:8761/eureka/"
    EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
    EUREKA_CLIENT_FETCH_REGISTRY: "true"
    EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "10"
    EUREKA_CLIENT_INSTANCE_INFO_REPLICATION_INTERVAL_SECONDS: "30"
    EUREKA_INSTANCE_HOSTNAME: "gateway"
    EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    EUREKA_CLIENT_HEALTHCHECK_ENABLED: "true"

    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics"

    SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED: "true"
    SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE_ID: "true"

    SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: "10000"
    SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: "60s"
    SPRING_CLOUD_GATEWAY_HTTPCLIENT_SSL_HANDSHAKE_TIMEOUT: "20000ms"
    SPRING_CLOUD_GATEWAY_HTTPCLIENT_POOL_MAX_CONNECTIONS: "100"
    SPRING_CLOUD_GATEWAY_HTTPCLIENT_POOL_MAX_IDLE_TIME: "1800s"
    SPRING_CLOUD_GATEWAY_HTTPCLIENT_POOL_PENDING_ACQUIRE_TIMEOUT: "45000ms"
    SPRING_CLOUD_GATEWAY_HTTPCLIENT_POOL_PENDING_ACQUIRE_MAX_COUNT: "-1"

    SPRING_CLOUD_GATEWAY_ROUTES_0_ID: "userRegistery"
    SPRING_CLOUD_GATEWAY_ROUTES_0_URI: "lb://USERREGISTRY"
    SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: "Path=/api/auth/**,/api/user/**"

    SPRING_CLOUD_GATEWAY_ROUTES_1_ID: "shop-service"
    SPRING_CLOUD_GATEWAY_ROUTES_1_URI: "lb://SHOP-SERVICE"
    SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: "Path=/api/services/**,/api/customer-profiles/**,/api/locations/**,/api/nearby/**,/api/products/**,/api/reels/**,/api/shops/**,/api/mobile/**,/api/users/**,/api/reviews/**,/api/shop-follow/**,/api/public/**"

    SPRING_CLOUD_GATEWAY_ROUTES_2_ID: "Servicechat"
    SPRING_CLOUD_GATEWAY_ROUTES_2_URI: "lb://SERVICECHAT"
    SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: "Path=/api/chat/**"

    SPRING_CLOUD_GATEWAY_ROUTES_3_ID: "OrderService"
    SPRING_CLOUD_GATEWAY_ROUTES_3_URI: "lb://ORDERSERVICE"
    SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: "Path=/api/cart/**,/api/orders/**,/api/analytics/**"

    SPRING_CLOUD_GATEWAY_ROUTES_4_ID: "SuperUser"
    SPRING_CLOUD_GATEWAY_ROUTES_4_URI: "lb://SuperUser"
    SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0: "Path=/admin/**"

    SPRING_CLOUD_GATEWAY_ROUTES_5_ID: "notification-service"
    SPRING_CLOUD_GATEWAY_ROUTES_5_URI: "lb://NOTIFICATION-SERVICE"
    SPRING_CLOUD_GATEWAY_ROUTES_5_PREDICATES_0: "Path=/api/activity-logs/**,/api/device-tokens/**,/api/notifications/**,/api/preferences/**"

    LOGGING_LEVEL_ROOT: "INFO"
    LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: "DEBUG"
    LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: "DEBUG"

    SPRING_PROFILES_ACTIVE: "kubernetes"

secret:
  enabled: false
  existingName: gateway-secret

serviceAccount:
  create: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "500m"
    memory: 512Mi

autoscaling:
  enabled: false

pdb:
  enabled: false

ingress:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

imagePullSecrets: []

podAnnotations: {}

probes:
  startup:
    path: /actuator/health
    failureThreshold: 30
    periodSeconds: 10

  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 5

  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 10
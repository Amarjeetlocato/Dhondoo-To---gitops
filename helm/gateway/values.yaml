# Default values for gateway.
# This is a YAML-formatted file.
# Declare variables to be passed to your templates.

replicaCount: 1

image:
  repository: whomaiamar/gateway
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1c1403db40bdc49be632a402f7b68662087383fe"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API token.
  automountServiceAccountToken: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8079
  targetPort: 8079

env:
  - name: SPRING_CLOUD_GATEWAY_ROUTES_0_ID
    value: "userRegistery"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_0_URI
    value: "lb://USERREGISTRY"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0
    value: "Path=/api/auth/**,/api/user/**"

  - name: SPRING_CLOUD_GATEWAY_ROUTES_1_ID
    value: "shop-service"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_1_URI
    value: "lb://SHOP-SERVICE"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0
    value: "Path=/s/**,/api/businesses/**,/api/services/**,/api/customer-profiles/**,/api/locations/**,/api/nearby/**,/api/products/**,/api/reels/**,/api/shops/**,/api/mobile/**,/api/users/**,/api/reviews/**,/api/shop-follow/**,/api/public/**"

  - name: SPRING_CLOUD_GATEWAY_ROUTES_2_ID
    value: "Servicechat"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_2_URI
    value: "lb://SERVICECHAT"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0
    value: "Path=/api/chat/**"

  - name: SPRING_CLOUD_GATEWAY_ROUTES_3_ID
    value: "OrderService"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_3_URI
    value: "lb://ORDERSERVICE"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0
    value: "Path=/api/cart/**,/api/orders/**,/api/analytics/**"

  - name: SPRING_CLOUD_GATEWAY_ROUTES_4_ID
    value: "SuperUser"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_4_URI
    value: "lb://SuperUser"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0
    value: "Path=/admin/**"

  - name: SPRING_CLOUD_GATEWAY_ROUTES_5_ID
    value: "notification-service"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_5_URI
    value: "lb://NOTIFICATION-SERVICE"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_5_PREDICATES_0
    value: "Path=/api/activity-logs/**,/api/device-tokens/**,/api/notifications/**,/api/preferences/**"

  - name: SPRING_CLOUD_GATEWAY_ROUTES_6_ID
    value: "billing-service"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_6_URI
    value: "lb://BILLINGSERVICE"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_6_PREDICATES_0
    value: "Path=/api/billing/**,/api/invoices/**,/api/payments/**"

  - name: SPRING_CLOUD_GATEWAY_ROUTES_7_ID
    value: "business-operation-service"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_7_URI
    value: "lb://BUSINESSOPERATIONSERVICE"
  - name: SPRING_CLOUD_GATEWAY_ROUTES_7_PREDICATES_0
    value: "Path=/api/business/**,/api/operations/**"

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
